---
name: Build agent containers

# Two images from one Dockerfile, one per `--target`:
#
#   runner  -> ghcr.io/brujoand/agent-runner     the CI image for the workflows
#   agent   -> ghcr.io/brujoand/brujoand-agent   what `bagent` launches locally
#
# `target` is NOT optional here. With none, docker builds the LAST stage, which
# would publish the interactive image under the runner's name and break CI.

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - containers/**
      - agent
      - agentcli/**
      - issue_agent/**
      - pyproject.toml
      - uv.lock
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: runner
            image: ghcr.io/brujoand/agent-runner
          - target: agent
            image: ghcr.io/brujoand/brujoand-agent

    name: ${{ matrix.target }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Log in to ghcr.io
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
